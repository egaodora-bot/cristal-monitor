name: Hourly Crustal Monitor Run

on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごとに自動実行
  workflow_dispatch:      # 手動実行ボタン

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy folium

      - name: Run crustal monitoring script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html previous_gnss_data.csv *_gnss_alert.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GNSS map and alert data" && git push)
