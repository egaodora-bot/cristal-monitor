name: Update earthquake data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-earthquake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest earthquake data
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://api.p2pquake.net/v2/history?codes=551&limit=20"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "GEONET-monitor/1.0"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          if not isinstance(data, list) or not data:
              raise RuntimeError("地震データが取得できませんでした")

          latest = None

          for item in data:
              eq = item.get("earthquake") or {}
              h = eq.get("hypocenter") or {}

              try:
                  lat = float(h.get("latitude"))
                  lon = float(h.get("longitude"))
              except (TypeError, ValueError):
                  continue

              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  continue

              def to_float(v):
                  try:
                      return float(v)
                  except (TypeError, ValueError):
                      return None

              latest = {
                  "source": "JMA/P2PQuake",
                  "earthquake_time": eq.get("time"),
                  "place": h.get("name", ""),
                  "lat": lat,
                  "lon": lon,
                  "depth_km": to_float(h.get("depth")),
                  "magnitude": to_float(h.get("magnitude")),
                  "max_intensity": ""
              }

              break

          if latest is None:
              raise RuntimeError("有効な震源データが見つかりませんでした")

          Path("latest_earthquake.json").write_text(
              json.dumps(
                  latest,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(json.dumps(
              latest,
              ensure_ascii=False,
              indent=2
          ))
          PY

      - name: Commit updated earthquake data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest_earthquake.json

          if git diff --cached --quiet; then
            echo "No earthquake data change."
          else
            git commit -m "Update latest earthquake data"
            git push
          fi
