<script>
/* ============================================================
   GEONET 地震表示 v4
   GitHub Actions が更新する latest_earthquake.json を読む
   ============================================================ */
(function () {
    const MAP = map_9fc8ef7a4f69528183184475ef0aaf11;
    if (!MAP) return;

    const earthquakeGroup = L.layerGroup().addTo(MAP);

    const quakeIcon = L.divIcon({
        className: 'geonet-eq-marker-v4',
        html:
            '<div style="width:24px;height:24px;border-radius:50%;' +
            'background:#e53935;border:3px solid #fff;' +
            'box-shadow:0 1px 8px rgba(0,0,0,.45);"></div>',
        iconSize:[30,30],
        iconAnchor:[15,15]
    });

    const panel = document.createElement('div');
    panel.id = 'geonet-latest-earthquake-v4';
    panel.style.cssText =
        'position:fixed;top:10px;left:50%;transform:translateX(-50%);' +
        'z-index:10001;background:rgba(255,255,255,.97);' +
        'padding:9px 13px;border:2px solid #e53935;border-radius:9px;' +
        'box-shadow:0 2px 10px rgba(0,0,0,.28);font:13px/1.45 sans-serif;' +
        'text-align:center;min-width:260px;max-width:calc(100vw - 20px);';
    panel.innerHTML = '<b style="color:#c62828;font-size:15px">🔴 地震情報</b><br>取得中…';
    document.body.appendChild(panel);

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, function(c) {
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
        });
    }

    function showQuake(q) {
        earthquakeGroup.clearLayers();

        if (!q || !Number.isFinite(Number(q.lat)) || !Number.isFinite(Number(q.lon))) {
            panel.innerHTML =
                '<b style="color:#666;font-size:15px">🔴 地震情報</b><br>' +
                '有効な地震データがありません';
            return;
        }

        const lat = Number(q.lat);
        const lon = Number(q.lon);
        const mag = q.magnitude ?? '不明';
        const depth = q.depth_km ?? '不明';
        const intensity = q.max_intensity || '不明';
        const place = q.place || '不明';
        const time = q.earthquake_time || q.time || '不明';

        L.marker([lat, lon], {icon:quakeIcon})
            .bindPopup(
                '<div style="font-family:sans-serif;line-height:1.6;min-width:220px">' +
                '<b style="font-size:16px;color:#c62828">🔴 地震</b><hr>' +
                '<b>震央:</b> ' + esc(place) + '<br>' +
                '<b>発生:</b> ' + esc(time) + '<br>' +
                '<b>M:</b> ' + esc(mag) + '<br>' +
                '<b>深さ:</b> ' + esc(depth) + ' km<br>' +
                '<b>最大震度:</b> ' + esc(intensity) +
                '</div>'
            )
            .addTo(earthquakeGroup);

        panel.innerHTML =
            '<b style="color:#c62828;font-size:15px">🔴 最新地震</b><br>' +
            esc(place) + '　M' + esc(mag) +
            '　最大震度' + esc(intensity) + '<br>' +
            esc(time) + '　深さ' + esc(depth) + ' km';
    }

    async function updateEarthquake() {
        try {
            const r = await fetch('latest_earthquake.json?cb=' + Date.now(), {
                cache: 'no-store'
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);

            const q = await r.json();
            showQuake(q);

            panel.innerHTML +=
                '<br><span style="font-size:10px;color:#2e7d32">' +
                'GitHub Actions更新データ</span>';

        } catch (e) {
            console.warn('latest_earthquake.json取得失敗:', e);

            panel.innerHTML =
                '<b style="color:#c62828;font-size:15px">🔴 地震情報</b><br>' +
                '<span style="color:#b71c1c">最新地震データ取得失敗</span><br>' +
                '<span style="font-size:11px;color:#666">次回自動更新を待機中</span>';
        }
    }

    L.control.layers(null, {
        '🔴 地震情報': earthquakeGroup
    }, {
        collapsed:true,
        position:'topright'
    }).addTo(MAP);

    updateEarthquake();
    setInterval(updateEarthquake, 5 * 60 * 1000);

    window.addEventListener('resize', function () {
        setTimeout(function () { MAP.invalidateSize(); }, 150);
    });

    window.addEventListener('orientationchange', function () {
        setTimeout(function () { MAP.invalidateSize(); }, 300);
    });
})();
</script>

<script>
/* ============================================================
   GEONET 最新地震JSON連動 v5
   - GitHub Actionsが更新する latest_earthquake.json を読む
   - 地図へ震央・M・深さ・最大震度・発生時刻を表示
   - 5分ごとに再取得
   - 既存GEONET/境界/活断層表示を維持
   ============================================================ */
(function () {
    const MAP = map_9fc8ef7a4f69528183184475ef0aaf11;
    if (!MAP) return;

    const quakeLayer = L.layerGroup().addTo(MAP);
    let lastEarthquakeKey = "";

    const quakeIcon = L.divIcon({
        className: 'geonet-live-earthquake-icon',
        html:
            '<div style="' +
            'width:24px;height:24px;border-radius:50%;' +
            'background:#e53935;border:3px solid #fff;' +
            'box-shadow:0 0 0 3px rgba(229,57,53,.25),0 2px 9px rgba(0,0,0,.45);' +
            '"></div>',
        iconSize: [30,30],
        iconAnchor: [15,15]
    });

    const panel = document.createElement('div');
    panel.id = 'geonet-earthquake-panel-v5';
    panel.style.cssText =
        'position:fixed;top:10px;left:50%;transform:translateX(-50%);' +
        'z-index:10000;background:rgba(255,255,255,.96);' +
        'border:2px solid #e53935;border-radius:9px;' +
        'box-shadow:0 2px 10px rgba(0,0,0,.25);' +
        'padding:8px 12px;font:13px/1.45 sans-serif;' +
        'text-align:center;min-width:250px;max-width:calc(100vw - 20px);';
    panel.innerHTML = '🔴 地震情報を取得中…';
    document.body.appendChild(panel);

    function fmt(v, suffix) {
        if (v === null || v === undefined || v === "") return "不明";
        return String(v) + (suffix || "");
    }

    function showEarthquake(q) {
        quakeLayer.clearLayers();

        if (!q || !Number.isFinite(Number(q.lat)) || !Number.isFinite(Number(q.lon))) {
            panel.innerHTML =
                '🔴 <b>地震情報</b><br>' +
                '<span style="color:#666">有効な震源座標がありません</span>';
            return;
        }

        const lat = Number(q.lat);
        const lon = Number(q.lon);

        const marker = L.marker([lat, lon], {icon: quakeIcon});

        const popup =
            '<div style="font-family:sans-serif;line-height:1.55;min-width:220px">' +
            '<b style="font-size:16px;color:#c62828">🔴 最新地震</b><hr style="margin:4px 0">' +
            '<b>震央:</b> ' + escapeHtml(q.place || "不明") + '<br>' +
            '<b>発生:</b> ' + escapeHtml(q.earthquake_time || q.time || "不明") + '<br>' +
            '<b>M:</b> ' + escapeHtml(fmt(q.magnitude)) + '<br>' +
            '<b>深さ:</b> ' + escapeHtml(fmt(q.depth_km, " km")) + '<br>' +
            '<b>最大震度:</b> ' + escapeHtml(q.max_intensity || "不明") + '<br>' +
            '<b>震央:</b> ' + lat.toFixed(4) + ', ' + lon.toFixed(4) +
            '</div>';

        marker.bindPopup(popup).addTo(quakeLayer);

        // 震央からの目安範囲。解析結果そのものではなく視認用。
        L.circle([lat, lon], {
            radius: 50000,
            color: '#e53935',
            weight: 1.5,
            opacity: 0.45,
            fillOpacity: 0.05
        }).addTo(quakeLayer);

        L.circle([lat, lon], {
            radius: 100000,
            color: '#e53935',
            weight: 1,
            opacity: 0.28,
            fillOpacity: 0.02
        }).addTo(quakeLayer);

        panel.innerHTML =
            '<b style="font-size:15px;color:#c62828">🔴 最新地震</b><br>' +
            escapeHtml(q.place || "不明") +
            '　M' + escapeHtml(fmt(q.magnitude)) +
            '　最大震度 ' + escapeHtml(q.max_intensity || "不明") +
            '<br>' +
            escapeHtml(q.earthquake_time || q.time || "発生時刻不明") +
            '　深さ ' + escapeHtml(fmt(q.depth_km, " km")) +
            '<br><span style="font-size:11px;color:#666">latest_earthquake.json 連動</span>';

        // 地震を画面中央寄りへ表示
        try {
            MAP.setView([lat, lon], Math.max(MAP.getZoom(), 6), {animate:false});
        } catch (e) {}
    }

    function escapeHtml(v) {
        return String(v ?? "").replace(/[&<>"']/g, function(c) {
            return {
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#39;'
            }[c];
        });
    }

    async function loadLatestEarthquake() {
        try {
            const r = await fetch(
                'latest_earthquake.json?cb=' + Date.now(),
                {
                    cache: 'no-store',
                    headers: {'Accept':'application/json'}
                }
            );

            if (!r.ok) throw new Error('HTTP ' + r.status);

            const q = await r.json();

            const key = [
                q.earthquake_time || '',
                q.place || '',
                q.lat || '',
                q.lon || '',
                q.magnitude || ''
            ].join('|');

            if (key !== lastEarthquakeKey) {
                showEarthquake(q);
                lastEarthquakeKey = key;
            } else {
                // 再取得確認済み
                showEarthquake(q);
            }

        } catch (err) {
            console.warn('latest_earthquake.json 取得失敗:', err);
            panel.innerHTML =
                '🔴 <b>地震情報</b><br>' +
                '<span style="color:#b71c1c">最新地震データを取得できません</span><br>' +
                '<span style="font-size:11px;color:#666">GitHub Actionsの更新待ち</span>';
        }
    }

    L.control.layers(null, {
        '🔴 最新地震': quakeLayer
    }, {
        collapsed: true,
        position: 'topright'
    }).addTo(MAP);

    loadLatestEarthquake();
    setInterval(loadLatestEarthquake, 5 * 60 * 1000);

    window.addEventListener('resize', function () {
        setTimeout(function () {
            try { MAP.invalidateSize(false); } catch(e) {}
        }, 150);
    });

    window.addEventListener('orientationchange', function () {
        setTimeout(function () {
            try { MAP.invalidateSize(false); } catch(e) {}
        }, 300);
    });
})();
</script>

/* ============================================================
   GEONET 全国統合表示 拡張
   - 既存の観測点データは変更しない
   - 観測点のpopup数値から表示色を自動判定
   - 極性境界候補CSVを読み込み紫線表示
   - 国土地理院「活断層図」タイルをON/OFF可能
   ============================================================ */
(function () {
    const MAP = map_9fc8ef7a4f69528183184475ef0aaf11;

    // --- 国土地理院 活断層図 ---
    const activeFaultLayer = L.tileLayer(
        'https://cyberjapandata.gsi.go.jp/xyz/afm/{z}/{x}/{y}.png',
        {
            minZoom: 11,
            maxZoom: 16,
            opacity: 0.85,
            attribution: '国土地理院 活断層図'
        }
    );

    // --- GEONET観測点の色分け ---
    // 既存popupに入っている「水平変動」「垂直変動」を読み取り、
    // 既存の基準（水平10mm / 垂直20mm）を維持して色だけ更新。
    function recolorStations() {
        MAP.eachLayer(function (layer) {
            if (!(layer instanceof L.Marker) || !layer.getPopup()) return;

            const html = layer.getPopup().getContent();
            if (typeof html !== 'string') return;

            const h = html.match(/水平変動:\s*([+-]?\d+(?:\.\d+)?)\s*mm/);
            const v = html.match(/垂直変動:[^<]*\(([+-]?\d+(?:\.\d+)?)\s*mm\)/);
            if (!h || !v) return;

            const horizontal = Math.abs(parseFloat(h[1]));
            const vertical = Math.abs(parseFloat(v[1]));

            let color = 'blue';
            if (horizontal >= 20 || vertical >= 40) color = 'red';
            else if (horizontal >= 10 || vertical >= 20) color = 'orange';

            try {
                layer.setIcon(L.AwesomeMarkers.icon({
                    markerColor: color,
                    iconColor: 'white',
                    icon: 'info-sign',
                    prefix: 'glyphicon',
                    extraClasses: 'fa-rotate-0'
                }));
            } catch (e) {}
        });
    }

    // --- 極性境界候補CSV ---
    const boundaryGroup = L.layerGroup();

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, function(c) {
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
        });
    }

    function parseCSVLine(line) {
        const out = [];
        let cur = '', quoted = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') {
                if (quoted && line[i+1] === '"') { cur += '"'; i++; }
                else quoted = !quoted;
            } else if (c === ',' && !quoted) {
                out.push(cur); cur = '';
            } else {
                cur += c;
            }
        }
        out.push(cur);
        return out;
    }

    fetch('GEONET_national_polarity_boundary_candidates.csv?cb=' + Date.now(), {
        cache: 'no-store'
    })
    .then(r => {
        if (!r.ok) throw new Error('CSV HTTP ' + r.status);
        return r.text();
    })
    .then(txt => {
        const lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) throw new Error('CSV empty');

        const headers = parseCSVLine(lines[0]);
        const idx = {};
        headers.forEach((h,i) => idx[h.trim()] = i);

        let count = 0;
        for (let i = 1; i < lines.length; i++) {
            const c = parseCSVLine(lines[i]);
            const plusLat = parseFloat(c[idx.plus_lat]);
            const plusLon = parseFloat(c[idx.plus_lon]);
            const minusLat = parseFloat(c[idx.minus_lat]);
            const minusLon = parseFloat(c[idx.minus_lon]);
            if (![plusLat,plusLon,minusLat,minusLon].every(Number.isFinite)) continue;

            const score = c[idx.pair_score] ?? '';
            const dist = c[idx.distance_km] ?? '';
            const diff = c[idx.polarity_difference_mm] ?? '';

            const line = L.polyline(
                [[plusLat, plusLon], [minusLat, minusLon]],
                {
                    color: '#8e24aa',
                    weight: 2.5,
                    opacity: 0.82
                }
            ).bindPopup(
                '<b>🟣 GEONET極性境界候補</b><hr style="margin:4px 0;">' +
                '＋局: ' + esc(c[idx.plus_station]) + '<br>' +
                '−局: ' + esc(c[idx.minus_station]) + '<br>' +
                '距離: ' + esc(dist) + ' km<br>' +
                '極性差: ' + esc(diff) + ' mm<br>' +
                'pair score: ' + esc(score)
            );

            boundaryGroup.addLayer(line);
            count++;
        }

        if (count > 0) boundaryGroup.addTo(MAP);
        window.GEONET_BOUNDARY_COUNT = count;
    })
    .catch(err => {
        console.warn('極性境界CSVを読み込めませんでした:', err);
        window.GEONET_BOUNDARY_COUNT = 0;
    });

    // --- レイヤー切替 ---
    const overlays = {
        '🟣 極性境界候補': boundaryGroup,
        '🟤 既知の活断層（国土地理院）': activeFaultLayer
    };
    L.control.layers(null, overlays, {
        collapsed: true,
        position: 'topright'
    }).addTo(MAP);

    // 初期表示は活断層レイヤーOFF。
    // 必要なときに右上のレイヤー選択からON。
    setTimeout(recolorStations, 800);

    // スマホ回転・画面サイズ変更への追従
    window.addEventListener('resize', function () {
        setTimeout(function () { MAP.invalidateSize(); }, 150);
    });
})();

</script>

<script>
(function () {
    // Folium may generate a different map variable name on each regeneration.
    // Find the actual Leaflet map dynamically instead of hard-coding an id.
    var MAP = null;

    try {
        var keys = Object.keys(window);
        for (var i = 0; i < keys.length; i++) {
            var value = window[keys[i]];
            if (value && typeof value.invalidateSize === "function" &&
                typeof value.addLayer === "function" &&
                value instanceof L.Map) {
                MAP = value;
                break;
            }
        }
    } catch (e) {}

    if (!MAP) {
        console.warn("GEONET: Leaflet map was not found.");
        return;
    }

    var quakeLayer = L.layerGroup().addTo(MAP);

    var verified = {
        place: "千葉県東方沖",
        earthquake_time: "2026/08/30 00:17頃",
        lat: 35.8,
        lon: 140.9,
        depth_km: 30,
        magnitude: 4.8,
        max_intensity: "4"
    };

    var quakeIcon = L.divIcon({
        className: "geonet-live-earthquake-v8",
        html:
            '<div style="' +
            'width:26px;height:26px;border-radius:50%;' +
            'background:#e53935;border:3px solid #fff;' +
            'box-shadow:0 0 0 4px rgba(229,57,53,.30),0 2px 10px rgba(0,0,0,.45);' +
            '"></div>',
        iconSize: [32,32],
        iconAnchor: [16,16]
    });

    var panel = document.createElement("div");
    panel.id = "geonet-earthquake-v8-panel";
    panel.style.cssText =
        "position:fixed;top:10px;left:50%;transform:translateX(-50%);" +
        "z-index:2147483647;background:#fff;" +
        "border:3px solid #d32f2f;border-radius:10px;" +
        "box-shadow:0 3px 14px rgba(0,0,0,.35);" +
        "padding:10px 14px;font:14px/1.5 Arial,sans-serif;" +
        "text-align:left;min-width:290px;" +
        "max-width:calc(100vw - 24px);box-sizing:border-box;";
    document.body.appendChild(panel);

    function esc(v) {
        return String(v == null ? "" : v).replace(/[&<>"']/g, function(c) {
            return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
        });
    }

    function showQuake(q, live) {
        var lat = Number(q.lat);
        var lon = Number(q.lon);

        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
            panel.innerHTML =
                '<b style="color:#c62828;font-size:16px">🔴 地震発生情報</b><br>' +
                '<span style="color:#a00">震央座標を取得できません。</span>';
            return;
        }

        quakeLayer.clearLayers();

        var marker = L.marker([lat, lon], {icon: quakeIcon});
        marker.bindPopup(
            '<div style="font-family:sans-serif;line-height:1.55;min-width:220px">' +
            '<b style="font-size:16px;color:#c62828">🔴 地震発生情報</b><hr>' +
            '<b>震央:</b> ' + esc(q.place || "不明") + '<br>' +
            '<b>発生:</b> ' + esc(q.earthquake_time || "不明") + '<br>' +
            '<b>M:</b> ' + esc(q.magnitude == null ? "不明" : q.magnitude) + '<br>' +
            '<b>深さ:</b> ' + esc(q.depth_km == null ? "不明" : q.depth_km + " km") + '<br>' +
            '<b>最大震度:</b> ' + esc(q.max_intensity || "不明") + '<br>' +
            '<b>座標:</b> ' + lat.toFixed(4) + ", " + lon.toFixed(4) +
            '</div>'
        );

        marker.addTo(quakeLayer);

        L.circle([lat, lon], {
            radius: 50000,
            color: "#e53935",
            weight: 2,
            opacity: .50,
            fillOpacity: .04
        }).addTo(quakeLayer);

        panel.innerHTML =
            '<div style="font-size:17px;font-weight:700;color:#c62828">🔴 地震発生情報</div>' +
            '<div style="font-size:14px;font-weight:700">' +
            esc(q.place || "震央不明") + '　M' +
            esc(q.magnitude == null ? "?" : q.magnitude) + '</div>' +
            '<div>発生：' + esc(q.earthquake_time || "不明") + '</div>' +
            '<div>深さ：' + esc(q.depth_km == null ? "不明" : q.depth_km + " km") +
            '　最大震度：' + esc(q.max_intensity || "不明") + '</div>' +
            '<div style="font-size:11px;color:' + (live ? "#2e7d32" : "#666") + '">' +
            (live ? "GitHub Actions → latest_earthquake.json" : "直近確認済み地震") +
            '</div>';
    }

    // Always display the last verified event first.
    showQuake(verified, false);

    // Get the current JSON produced by GitHub Actions.
    function loadLatest() {
        fetch("latest_earthquake.json?cb=" + Date.now(), {
            cache: "no-store",
            headers: {"Accept": "application/json"}
        })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .then(function (q) {
            if (q && Number.isFinite(Number(q.lat)) &&
                Number.isFinite(Number(q.lon))) {
                showQuake(q, true);
            }
        })
        .catch(function (e) {
            console.warn("latest_earthquake.json:", e);
            // Keep verified marker visible on feed failure.
        });
    }

    L.control.layers(null, {
        "🔴 地震発生情報": quakeLayer
    }, {
        collapsed: false,
        position: "topright"
    }).addTo(MAP);

    loadLatest();
    setInterval(loadLatest, 5 * 60 * 1000);

    window.addEventListener("resize", function () {
        setTimeout(function () {
            try { MAP.invalidateSize(false); } catch (e) {}
        }, 150);
    });

    window.addEventListener("orientationchange", function () {
        setTimeout(function () {
            try { MAP.invalidateSize(false); } catch (e) {}
        }, 300);
    });
})();
</script>
