<style>
#cristal-monitor-panel {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 330px;
  max-width: calc(100vw - 24px);
  z-index: 10000;
  font-family: sans-serif;
  font-size: 12px;
  color: #222;
}
.cm-card {
  background: rgba(255,255,255,.95);
  border: 1px solid #bbb;
  border-radius: 10px;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.cm-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 7px;
}
.cm-sub {
  color: #666;
  font-size: 11px;
  margin-bottom: 6px;
}
.cm-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 6px;
  align-items: center;
  padding: 5px 0;
  border-top: 1px solid #eee;
}
.cm-row:first-child { border-top: 0; }
.cm-badge {
  display: inline-flex;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  background: #7b1fa2;
  color: #fff;
  font-size: 10px;
}
.cm-score { font-weight: 700; }
.cm-muted { color: #666; font-size: 10px; }
.cm-quake {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 7px;
  align-items: center;
  padding: 5px 0;
  border-top: 1px solid #eee;
}
.cm-quake-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d32f2f;
}
.cm-note {
  font-size: 10px;
  color: #666;
  line-height: 1.35;
  margin-top: 7px;
}
@media (max-width: 700px) {
  #cristal-monitor-panel {
    top: 6px;
    right: 6px;
    width: 285px;
    font-size: 11px;
  }
  .cm-card { padding: 8px 9px; }
  .cm-title { font-size: 13px; }
}
</style>

<script>
(function() {
  const MAP = map_5de67b24d57cce503b296b64197a2d37;
  const DATA_URL = 'GEONET_national_monitoring_candidates.json?_=' + Date.now();
  const LATEST_URL = 'latest_earthquake.json?_=' + Date.now();

  const panel = document.createElement('div');
  panel.id = 'cristal-monitor-panel';
  panel.innerHTML = `
    <div class="cm-card" id="cm-monitor-card">
      <div class="cm-title">重点監視候補 TOP 5</div>
      <div class="cm-sub">GNSS年間移動量＋極性境界近接度</div>
      <div id="cm-monitor-list">読み込み中…</div>
      <div class="cm-note">地震発生場所の確定予測ではなく、監視優先度の候補表示です。</div>
    </div>
    <div class="cm-card" id="cm-quake-card">
      <div class="cm-title">地震発生情報（最新5件）</div>
      <div class="cm-sub">GitHub上の最新地震データを自動取得</div>
      <div id="cm-quake-list">読み込み中…</div>
    </div>
  `;
  document.body.appendChild(panel);

  const monitorLayer = L.layerGroup().addTo(MAP);
  const quakeLayer = L.layerGroup().addTo(MAP);

  // GSI Active Fault Map tile. Available at zoom 11-16.
  const activeFaultLayer = L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/afm/{z}/{x}/{y}.png',
    {
      minZoom: 11,
      maxZoom: 16,
      opacity: 0.72,
      attribution: '© 国土地理院 活断層図'
    }
  ).addTo(MAP);

  const overlay = {
    '重点監視候補': monitorLayer,
    '地震（7日）': quakeLayer,
    '活断層図（GSI）': activeFaultLayer
  };
  L.control.layers(null, overlay, {collapsed: true, position: 'topright'}).addTo(MAP);

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function num(v, d=0) {
    const n = Number(v);
    return Number.isFinite(n) ? n : d;
  }

  function asArray(x) {
    if (Array.isArray(x)) return x;
    if (!x || typeof x !== 'object') return [];
    if (Array.isArray(x.events)) return x.events;
    if (Array.isArray(x.earthquakes)) return x.earthquakes;
    if (Array.isArray(x.data)) return x.data;
    if (x.earthquake) return [x];
    return [];
  }

  function quakeParts(ev) {
    const q = ev && ev.earthquake ? ev.earthquake : ev;
    const h = q && (q.hypocenter || q.hypocenterInfo || q.location || q) || {};
    const timeRaw = ev.time || ev.datetime || ev.created_at || ev.createdAt || q.time || q.datetime || '';
    const name = h.name || h.area || h.region || q.name || ev.name || '';
    let lat = num(h.latitude, NaN);
    let lon = num(h.longitude, NaN);
    if (!Number.isFinite(lat)) lat = num(ev.latitude, NaN);
    if (!Number.isFinite(lon)) lon = num(ev.longitude, NaN);
    const mag = num(h.magnitude ?? q.magnitude ?? ev.magnitude, NaN);
    let depth = h.depth ?? q.depth ?? ev.depth ?? '';
    if (typeof depth === 'object' && depth !== null) depth = depth.value ?? depth.depth ?? '';
    let maxInt = ev.maxIntensity ?? q.maxIntensity ?? ev.maxIntensityJma ?? q.maxScale ?? '';
    if (ev.points && Array.isArray(ev.points)) {
      // P2PQuake: calc max scale label from points if present
      const scales = ev.points.map(p => Number(p.scale)).filter(Number.isFinite);
      if (scales.length) maxInt = Math.max(...scales);
    }
    return {timeRaw, name, lat, lon, mag, depth, maxInt};
  }

  function formatTime(s) {
    if (!s) return '時刻不明';
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return String(s);
    return d.toLocaleString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  async function getJson(url) {
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status + ' ' + url);
    return await r.json();
  }

  function renderMonitors(data) {
    const all = Array.isArray(data) ? data : (data.top10 || data.all || []);
    const top = all.slice(0,5);
    const list = document.getElementById('cm-monitor-list');

    monitorLayer.clearLayers();

    if (!top.length) {
      list.innerHTML = '<div class="cm-muted">重点監視候補データなし</div>';
      return;
    }

    list.innerHTML = top.map((r, i) => `
      <div class="cm-row">
        <span class="cm-badge">${i+1}</span>
        <div>
          <b>${esc(r.station)}</b>
          <div class="cm-muted">Net3D ${num(r.net_3d_mm_per_year).toFixed(1)} mm/年 ・境界 ${num(r.nearest_boundary_distance_km).toFixed(2)} km</div>
        </div>
        <span class="cm-score">${num(r.score).toFixed(2)}</span>
      </div>
    `).join('');

    top.forEach((r, i) => {
      const marker = L.circleMarker(
        [num(r.lat), num(r.lon)],
        {
          radius: 9,
          weight: 2,
          opacity: 1,
          fillOpacity: 0.84
        }
      ).addTo(monitorLayer);

      marker.bindPopup(`
        <div style="font-family:sans-serif;font-size:12px;line-height:1.55;min-width:210px;">
          <b style="font-size:14px;">重点監視候補 #${i+1}</b><hr style="margin:5px 0;">
          <b>観測点:</b> ${esc(r.station)}<br>
          <b>総合Score:</b> ${num(r.score).toFixed(2)}<br>
          <b>年間Net 3D:</b> ${num(r.net_3d_mm_per_year).toFixed(2)} mm/年<br>
          <b>年間累積3D:</b> ${num(r.cumulative_3d_mm_per_year).toFixed(2)} mm/年<br>
          <b>極性境界距離:</b> ${num(r.nearest_boundary_distance_km).toFixed(2)} km<br>
          <b>観測期間:</b> ${esc(r.start_date)} → ${esc(r.end_date)}<br>
          <b>判定:</b> ${esc(r.label || '重点監視候補')}
        </div>
      `);

      // clicking the list row is intentionally simple and mobile-friendly
    });
  }

  function renderQuakes(raw) {
    let events = asArray(raw);
    if (!events.length) {
      document.getElementById('cm-quake-list').innerHTML = '<div class="cm-muted">地震履歴JSONが未取得です</div>';
      return;
    }

    const parsed = events.map(quakeParts)
      .filter(e => Number.isFinite(e.lat) && Number.isFinite(e.lon))
      .sort((a,b) => new Date(b.timeRaw || 0) - new Date(a.timeRaw || 0));

    quakeLayer.clearLayers();

    parsed.forEach((e) => {
      const marker = L.circleMarker([e.lat, e.lon], {
        radius: Math.max(4, Math.min(9, Number.isFinite(e.mag) ? 3 + e.mag : 5)),
        weight: 1.5,
        opacity: 0.9,
        fillOpacity: 0.55
      }).addTo(quakeLayer);

      marker.bindPopup(`
        <div style="font-family:sans-serif;font-size:12px;line-height:1.5;min-width:200px;">
          <b>地震発生情報</b><hr style="margin:5px 0;">
          <b>時刻:</b> ${esc(formatTime(e.timeRaw))}<br>
          <b>震源:</b> ${esc(e.name || '不明')}<br>
          <b>M:</b> ${Number.isFinite(e.mag) ? e.mag.toFixed(1) : '不明'}<br>
          <b>深さ:</b> ${esc(e.depth === '' ? '不明' : e.depth + (String(e.depth).includes('km') ? '' : ' km'))}<br>
          <b>最大震度:</b> ${esc(e.maxInt === '' ? '不明' : e.maxInt)}
        </div>
      `);
    });

    document.getElementById('cm-quake-list').innerHTML =
      parsed.slice(0,5).map((e) => `
        <div class="cm-quake">
          <span class="cm-quake-dot"></span>
          <div>
            <b>${esc(e.name || '震源不明')}</b>
            <div class="cm-muted">${esc(formatTime(e.timeRaw))}</div>
          </div>
          <span><b>${Number.isFinite(e.mag) ? 'M'+e.mag.toFixed(1) : 'M-'}</b></span>
        </div>
      `).join('');
  }

  async function loadMonitor() {
    try {
      const data = await getJson(DATA_URL);
      renderMonitors(data);
    } catch (err) {
      document.getElementById('cm-monitor-list').innerHTML =
        '<div class="cm-muted">重点監視データを取得できませんでした</div>';
      console.warn('monitor JSON:', err);
    }
  }

  async function loadQuakes() {
    try {
      const latest = await getJson(LATEST_URL);
      renderQuakes(latest);
    } catch (err) {
      document.getElementById('cm-quake-list').innerHTML =
        '<div class="cm-muted">最新地震データを取得できませんでした</div>';
      console.warn('latest earthquake JSON:', err);
    }
  }

  loadMonitor();
  loadQuakes();

  // refresh dynamic feeds every 5 minutes
  setInterval(loadMonitor, 300000);
  setInterval(loadQuakes, 300000);
  })();
</script>
