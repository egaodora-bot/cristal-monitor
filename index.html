        return '<div class="cm-row cm-linkrow" data-rank="'+(i+1)+'">'+
          '<span class="cm-badge">'+(i+1)+'</span><div><b class="cm-region">'+esc(reg)+'</b> <span class="cm-muted">('+esc(r.station)+')</span>'+
          '<div class="cm-muted">Net3D '+num(r.net_3d_mm_per_year).toFixed(1)+' mm/年 ・境界 '+num(r.nearest_boundary_distance_km).toFixed(2)+' km</div></div>'+
          '<span class="cm-score">'+num(r.score).toFixed(2)+'</span></div>';
      }).join('') : '<div class="cm-muted">重点監視候補データなし</div>';
    }
    monitorLayer.clearLayers();
    top.forEach((r,i) => {
      const lat=num(r.lat,NaN), lon=num(r.lon,NaN);
      if (!Number.isFinite(lat)||!Number.isFinite(lon)) return;
      const mk=L.marker([lat,lon],{icon:monitorPointIcon(i+1)}).addTo(monitorLayer);
      mk.bindPopup('<b>重点監視候補 #'+(i+1)+'</b><hr style="margin:5px 0;">'+
        '<b>地域:</b> '+esc(regionName(lat,lon))+'<br>'+
        '<b>観測点:</b> '+esc(r.station)+'<br>'+
        '<b>Score:</b> '+num(r.score).toFixed(2)+'<br>'+
        '<b>年間Net 3D:</b> '+num(r.net_3d_mm_per_year).toFixed(2)+' mm/年<br>'+
        '<b>累積3D:</b> '+num(r.cumulative_3d_mm_per_year).toFixed(2)+' mm/年<br>'+
        '<b>極性境界距離:</b> '+num(r.nearest_boundary_distance_km).toFixed(2)+' km');
    });
  }

  function quakeParts(ev) {
    const q=ev&&ev.earthquake?ev.earthquake:ev;
    const h=(q&&(q.hypocenter||q.hypocenterInfo||q.location||q))||{};
    const timeRaw=ev.time||ev.datetime||q.time||q.datetime||'';
    const name=h.name||h.area||h.region||q.name||ev.name||'';
    const lat=num(h.latitude,NaN), lon=num(h.longitude,NaN);
    const mag=num(h.magnitude??q.magnitude??ev.magnitude,NaN);
    const depth=h.depth??q.depth??ev.depth??'';
    return {timeRaw,name,lat,lon,mag,depth};
  }
  function formatTime(s) {
    if(!s) return '時刻不明';
    const d=new Date(s); if(Number.isNaN(d.getTime())) return String(s);
    return d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }

  async function loadJson(url) {
    const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json();
  }

  async function loadMonitor() {
    const list=document.getElementById('cm-monitor-list');
    try {
      const data=await loadJson(DATA_URL); renderMonitors(data);
    } catch(e) {
      if(list) list.innerHTML='<div class="cm-muted">重点監視データを取得できませんでした</div>';
    }
  }
  async function loadQuakes() {
    const list=document.getElementById('cm-quake-list');
    try {
      const raw=await loadJson(LATEST_URL);
      const parsed=asArray(raw).map(quakeParts).filter(e=>Number.isFinite(e.lat)&&Number.isFinite(e.lon))
        .sort((a,b)=>new Date(b.timeRaw||0)-new Date(a.timeRaw||0));
      quakeLayer.clearLayers();
      parsed.forEach(e=>{
        const mk=L.circleMarker([e.lat,e.lon],{radius:Number.isFinite(e.mag)?Math.max(5,Math.min(11,3+e.mag*1.8)):6,weight:1.5,opacity:.95,fillOpacity:.60});
        mk.addTo(quakeLayer);
        mk.bindPopup('<b>地震発生情報</b><hr style="margin:5px 0;">時刻: '+esc(formatTime(e.timeRaw))+'<br>震源: '+esc(e.name||'不明')+'<br>M: '+(Number.isFinite(e.mag)?e.mag.toFixed(1):'不明')+'<br>深さ: '+esc(e.depth||'不明'));
      });
      if(list) list.innerHTML=parsed.slice(0,5).map(e=>'<div class="cm-quake"><span class="cm-quake-dot"></span><div><b>'+esc(e.name||'震源不明')+'</b><div class="cm-muted">'+esc(formatTime(e.timeRaw))+'</div></div><span><b>'+ (Number.isFinite(e.mag)?'M'+e.mag.toFixed(1):'M-') +'</b></span></div>').join('') || '<div class="cm-muted">最新地震データなし</div>';
    } catch(e) {
      if(list) list.innerHTML='<div class="cm-muted">最新地震データを取得できませんでした</div>';
    }
  }

  // Build panel compatible with existing CSS.
  const panel=document.createElement('div');
  panel.id='cristal-monitor-panel';
  panel.innerHTML='<div class="cm-card" id="cm-monitor-card">'+
    '<div class="cm-title">重点監視候補 TOP 10</div>'+
    '<div class="cm-sub">地域名（概算）＋GNSS年間移動量＋極性境界近接度</div>'+
    '<div id="cm-monitor-list">読み込み中…</div>'+
    '<div class="cm-note">地震発生場所の確定予測ではなく、監視優先度の候補表示です。</div></div>'+
    '<div class="cm-card" id="cm-quake-card"><div class="cm-title">地震発生情報（最新5件）</div>'+
    '<div class="cm-sub">GitHub上の最新地震データを自動取得</div><div id="cm-quake-list">読み込み中…</div></div>';
  document.body.appendChild(panel);

  // Legend/layers
  L.control.layers(null,{
    '水平変動':horizontalLayer,
    '隆起・沈降':verticalLayer,
    '重点監視候補 TOP 10':monitorLayer,
    '地震':quakeLayer,
    '活断層図（GSI）':activeFaultLayer
  },{collapsed:true,position:'topright'}).addTo(MAP);

  document.getElementById('cm-toggle-horizontal').addEventListener('change',e=>{ if(e.target.checked) horizontalLayer.addTo(MAP); else MAP.removeLayer(horizontalLayer); });
  document.getElementById('cm-toggle-vertical').addEventListener('change',e=>{ if(e.target.checked) verticalLayer.addTo(MAP); else MAP.removeLayer(verticalLayer); });
  document.getElementById('cm-toggle-monitor').addEventListener('change',e=>{ if(e.target.checked) monitorLayer.addTo(MAP); else MAP.removeLayer(monitorLayer); });

  loadMonitor();
  loadQuakes();
  setInterval(loadMonitor,300000);
  setInterval(loadQuakes,300000);
})();
</script>
</html>
